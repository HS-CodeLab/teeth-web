<!DOCTYPE html><html lang="en" data-bs-theme="dark"><head><meta charset="utf-8"><script>var t=localStorage.getItem('theme');if(t){document.documentElement.dataset.theme=t;document.documentElement.dataset.bsTheme=t}</script><meta name="viewport" content="width=device-width,initial-scale=1"><title>Appointment | Belleville Dental</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body>
<main><section class="banner" style="background-image:linear-gradient(rgba(6,41,43,.75),rgba(6,41,43,.75)),url(images/appointment-banner.jpg),url(images/about-banner.jpg)"><h1>Book an Appointment</h1><p>Choose your treatment, doctor and a time that suits you.</p></section>
<div class="container sec"><div class="row g-4"><div class="col-lg-7"><form id="ap" class="card-t p-4" novalidate><div class="row g-3">
<div class="col-md-6"><label class="form-label" for="n">Full name</label><input id="n" class="form-control" required></div>
<div class="col-md-6"><label class="form-label" for="ph">Phone number</label><input id="ph" class="form-control" required placeholder="03xx xxxxxxx"></div>
<div class="col-md-6"><label class="form-label" for="em">Email</label><input id="em" type="email" class="form-control" required></div>
<div class="col-md-6"><label class="form-label" for="sv">Treatment</label><select id="sv" class="form-select"><option>Teeth Cleaning</option><option>Teeth Whitening</option><option>Braces and Aligners</option><option>Dental Implants</option><option>Root Canal</option><option>Kids Dentistry</option><option>General Checkup</option></select></div>
<div class="col-md-6"><label class="form-label" for="dr">Doctor</label><select id="dr" class="form-select"><option>No preference</option><option>Dr. Ayesha Khan</option><option>Dr. Sara Malik</option><option>Dr. Hamza Raza</option><option>Dr. Fatima Siddiqui</option></select></div>
<div class="col-md-3"><label class="form-label" for="dt">Date</label><input id="dt" type="date" class="form-control" required></div>
<div class="col-md-3"><label class="form-label" for="tm">Time</label><select id="tm" class="form-select"></select></div>
<div class="col-12"><label class="form-label" for="nt">Notes (optional)</label><textarea id="nt" rows="3" class="form-control"></textarea></div>
<div class="col-12"><button class="btn btn-t btn-lg">Confirm appointment</button></div></div><div id="am" class="alert mt-3 d-none" role="alert"></div></form></div>
<div class="col-lg-5"><div class="card-t p-4 mb-4"><h5>Clinic hours</h5><p>Monday to Saturday, 9am to 8pm<br>Sunday closed</p><p class="mb-0">Aptech Karachi Branch, Karachi, Pakistan<br>+92 300 0000000</p></div><div class="card-t p-4"><h5>Your bookings</h5><div id="bk" class="text-secondary">No appointments yet.</div></div></div></div></div></main>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/main.js"></script><script src="js/appointment.js"></script></body></html>
